[package]
name = "mac_native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi9"] }
napi-derive = "3"
core-foundation-sys = "0.8"
sysinfo = "0.32"
listeners = "0.6.1"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
