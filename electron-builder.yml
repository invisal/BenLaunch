appId: com.benpocket.benlaunch
productName: BenLaunch

directories:
  output: dist
  buildResources: build

# electron-vite emits the app into out/; node_modules (prod + optional deps) is
# added automatically by electron-builder.
files:
  - out/**
  - package.json
  # @benpocket/{win,mac,linux} each ship a prebuilt napi .node but also carry
  # their Rust source and build tree (~700 MB) — keep only what the addon
  # needs at runtime.
  - "!node_modules/@benpocket/win/target/**"
  - "!node_modules/@benpocket/win/src/**"
  - "!node_modules/@benpocket/win/node_modules/**"
  - "!node_modules/@benpocket/win/Cargo.*"
  - "!node_modules/@benpocket/win/build.rs"
  - "!node_modules/@benpocket/win/package-lock.json"
  - "!node_modules/@benpocket/mac/target/**"
  - "!node_modules/@benpocket/mac/src/**"
  - "!node_modules/@benpocket/mac/node_modules/**"
  - "!node_modules/@benpocket/mac/Cargo.*"
  - "!node_modules/@benpocket/mac/build.rs"
  - "!node_modules/@benpocket/mac/package-lock.json"
  - "!node_modules/@benpocket/linux/target/**"
  - "!node_modules/@benpocket/linux/src/**"
  - "!node_modules/@benpocket/linux/node_modules/**"
  - "!node_modules/@benpocket/linux/Cargo.*"
  - "!node_modules/@benpocket/linux/build.rs"
  - "!node_modules/@benpocket/linux/package-lock.json"

asar: true
asarUnpack:
  - "**/*.node"
  - "node_modules/@benpocket/**"

# @benpocket/{win,mac,linux} are all Node-API (ABI-stable) prebuilts; nothing
# here needs a native rebuild against Electron headers.
npmRebuild: false

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
