name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # tsconfig.node.json maps @magibar/{win,mac,linux} straight to their
      # committed native/<os>/index.d.ts via `paths`, so typecheck resolves
      # all three regardless of which optionalDependency actually installed
      # on this OS — no need to build native addons just to typecheck.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Each OS's own @magibar/<os> optionalDependency install script
    # (napi build --release) runs as part of `npm ci` below.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Packaging smoke test only — no publish, no signing. electron-builder.yml
      # has mac.notarize: true, but only release.yml imports the real Apple
      # signing certificate; CSC_IDENTITY_AUTO_DISCOVERY=false makes
      # electron-builder skip signing here (and skip notarizing an unsigned
      # app), so this stays fast and needs no Apple secrets.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --dir

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --dir
